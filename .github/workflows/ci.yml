name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            proxy-ST/requirements.txt
            proxy-ST/requirements-dev.txt
      - name: Install proxy test and type-check dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: proxy-ST
      - name: Run proxy tests
        run: pytest -q
        working-directory: proxy-ST
      - name: Lint supported proxy paths
        run: ruff check proxy_st tests
        working-directory: proxy-ST
      - name: Strict type-check supported proxy modules
        run: mypy --strict proxy_st/schemas.py proxy_st/health.py
        working-directory: proxy-ST

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: responses-proxy/package-lock.json
      - name: Install locked extension dependencies
        run: npm ci
        working-directory: responses-proxy
      - name: Run extension unit tests
        run: npm run test:unit
        working-directory: responses-proxy
      - name: Build extension
        run: npm run build
        working-directory: responses-proxy

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration without starting containers
        run: docker compose --env-file .env.public.example -f compose.public.yaml config --quiet

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Keep the blocking scan inside this repository. Hermes has its own
          # separately documented audit because its pinned tree has findings.
          submodules: false
      - name: Install verified Gitleaks CLI 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          if ! printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status; then
            echo "Gitleaks release checksum verification failed."
            exit 1
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan tracked root files and root history without exposing matches
        shell: bash
        run: |
          set -euo pipefail
          files_root="$RUNNER_TEMP/gitleaks-file-tree"
          mkdir -p "$files_root"
          python3 - "$files_root" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          destination = Path(sys.argv[1]).resolve()
          tree = subprocess.run(
              ["git", "ls-tree", "-rz", "--full-tree", "HEAD"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          tracked = 0
          skipped_gitlinks = 0
          for entry in tree.split(b"\0"):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode, object_type, object_id = metadata.decode("ascii").split()
              if mode == "160000" or object_type == "commit":
                  skipped_gitlinks += 1
                  continue
              if object_type != "blob":
                  continue
              relative = Path(os.fsdecode(raw_path))
              target = (destination / relative).resolve()
              if target != destination and destination not in target.parents:
                  raise SystemExit("A tracked path escapes the scan directory.")
              target.parent.mkdir(parents=True, exist_ok=True)
              blob = subprocess.run(
                  ["git", "cat-file", "blob", object_id.decode("ascii")],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              # Scan the literal tracked link target without following it.
              target.write_bytes(blob)
              tracked += 1
          print(f"Prepared {tracked} tracked root file(s); skipped {skipped_gitlinks} gitlink(s).")
          PY
          set +e
          gitleaks dir --no-banner --redact=100 --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-files.json" "$files_root" >/dev/null 2>&1
          files_status=$?
          gitleaks git --no-banner --redact=100 --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-history.json" \
            --log-opts="--full-history --all --diff-filter=tuxdb" . >/dev/null 2>&1
          history_status=$?
          set -e
          GITLEAKS_FILES_REPORT="$RUNNER_TEMP/gitleaks-files.json" \
          GITLEAKS_FILES_BASE="$files_root" \
          GITLEAKS_HISTORY_REPORT="$RUNNER_TEMP/gitleaks-history.json" \
          GITLEAKS_FILES_STATUS="$files_status" \
          GITLEAKS_HISTORY_STATUS="$history_status" python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path.cwd().resolve()
          files_base = Path(os.environ["GITLEAKS_FILES_BASE"]).resolve()
          scans = (
              ("files", Path(os.environ["GITLEAKS_FILES_REPORT"]), int(os.environ["GITLEAKS_FILES_STATUS"])),
              ("history", Path(os.environ["GITLEAKS_HISTORY_REPORT"]), int(os.environ["GITLEAKS_HISTORY_STATUS"])),
          )
          failed = False
          total = 0
          try:
              for scope, report, status in scans:
                  try:
                      findings = json.loads(report.read_text()) if report.exists() and report.stat().st_size else []
                      if not isinstance(findings, list):
                          raise json.JSONDecodeError("Expected a JSON array", "", 0)
                  except (OSError, json.JSONDecodeError):
                      print(f"Gitleaks {scope} report is unreadable; scanner output is withheld.")
                      failed = True
                      continue

                  total += len(findings)
                  for finding in findings:
                      raw_path = finding.get("File") if isinstance(finding, dict) else None
                      candidate = Path(raw_path) if isinstance(raw_path, str) else Path("<unknown>")
                      base = files_base if scope == "files" else root
                      try:
                          resolved = candidate.resolve() if candidate.is_absolute() else (base / candidate).resolve()
                          display_path = resolved.relative_to(base).as_posix()
                      except ValueError:
                          display_path = "<outside-workspace>"
                      details = {
                          "scope": scope,
                          "file": display_path,
                          "line": finding.get("StartLine", "?") if isinstance(finding, dict) else "?",
                          "rule": finding.get("RuleID", "unknown") if isinstance(finding, dict) else "unknown",
                      }
                      print("Review " + json.dumps(details, ensure_ascii=True))
                  if status != 0:
                      failed = True

              if total == 0 and not failed:
                  print("Gitleaks found no potential secrets in files or Git history.")
              elif total:
                  print(f"Gitleaks found {total} potential secret(s); values are withheld.")
              elif failed:
                  print("Gitleaks failed; scanner output is withheld.")
          finally:
              for _, report, _ in scans:
                  report.unlink(missing_ok=True)
              shutil.rmtree(files_base, ignore_errors=True)

          raise SystemExit(1 if failed else 0)
          PY
